<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1180" role="img" aria-label="production-v1.1.1 de-identification and re-identification pipeline: a merchant source is extracted and DLP-tokenized before landing in GCS, staged and loaded into BigQuery as a queryable but still-tokenized table, automatically reconciled against a token vault API with no human step, and re-identified via Cloud DLP and a KMS-wrapped key only at the write-back POST to the merchant's target system.">
  <title>De-identification / Re-identification Token Migration ETL</title>
  <desc>production-v1.1.1's pipeline: Merchant Source(s) to Extraction Adapter to GCS (DLP-tokenized) to Staging Service to BigQuery (reconciled, tokenized), automatically reconciled by a Token Vault API, then re-identified via Cloud DLP + Cloud KMS exclusively at the Sink Adapter's write-back POST to Merchant Target System.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000000"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f8b8b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="2000" height="1180" fill="#ffffff"/>

  <!-- outer border -->
  <rect x="40" y="90" width="1920" height="1040" rx="20" fill="none" stroke="#000000" stroke-width="3"/>

  <!-- title bar -->
  <rect x="55" y="65" width="610" height="70" rx="10" fill="#000000"/>
  <text x="80" y="110" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="bold" fill="#ffffff">De-identification / Re-identification ETL</text>
  <text x="80" y="188" font-family="Helvetica, Arial, sans-serif" font-size="19" font-style="italic" fill="#555555">enterprise-scale, automated, dormant</text>

  <!-- Merchant Source(s) cylinder -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#000000">
    <ellipse cx="190" cy="250" rx="130" ry="24" fill="#ffffff" stroke="#000000" stroke-width="2.5"/>
    <rect x="60" y="250" width="260" height="125" fill="#ffffff" stroke="none"/>
    <line x1="60" y1="250" x2="60" y2="375" stroke="#000000" stroke-width="2.5"/>
    <line x1="320" y1="250" x2="320" y2="375" stroke="#000000" stroke-width="2.5"/>
    <ellipse cx="190" cy="375" rx="130" ry="24" fill="#ffffff" stroke="#000000" stroke-width="2.5"/>
    <text x="190" y="308" text-anchor="middle">Merchant</text>
    <text x="190" y="333" text-anchor="middle">Source(s)</text>
  </g>

  <!-- arrow: Source -> Extraction -->
  <line x1="320" y1="318" x2="396" y2="318" stroke="#000000" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="358" y="300" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold">{GET,</text>
  <text x="358" y="318" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold">Dataflow}</text>

  <!-- Extraction Adapter -->
  <rect x="400" y="263" width="250" height="110" rx="14" fill="#ffffff" stroke="#000000" stroke-width="2.5"/>
  <text x="525" y="313" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold">Extraction</text>
  <text x="525" y="338" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold">Adapter</text>

  <!-- arrow: Extraction -> GCS -->
  <line x1="650" y1="318" x2="686" y2="318" stroke="#000000" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="668" y="300" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold">{GET}</text>

  <!-- GCS Bucket cylinder -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#000000">
    <ellipse cx="830" cy="250" rx="140" ry="24" fill="#ffffff" stroke="#000000" stroke-width="2.5"/>
    <rect x="690" y="250" width="280" height="125" fill="#ffffff" stroke="none"/>
    <line x1="690" y1="250" x2="690" y2="375" stroke="#000000" stroke-width="2.5"/>
    <line x1="970" y1="250" x2="970" y2="375" stroke="#000000" stroke-width="2.5"/>
    <ellipse cx="830" cy="375" rx="140" ry="24" fill="#ffffff" stroke="#000000" stroke-width="2.5"/>
    <text x="830" y="298" text-anchor="middle" font-weight="bold">GCS Bucket</text>
    <text x="830" y="322" text-anchor="middle">raw/&lt;merchant&gt;/</text>
    <text x="830" y="346" text-anchor="middle">(DLP-tokenized)</text>
  </g>

  <!-- arrow: GCS -> Staging Service (diagonal) -->
  <line x1="830" y1="399" x2="1002" y2="456" stroke="#000000" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="905" y="418" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold">reads</text>
  <text x="905" y="436" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold">transformed/</text>

  <!-- Staging Service parallelogram -->
  <polygon points="1010,460 1330,460 1290,600 970,600" fill="#ffffff" stroke="#000000" stroke-width="2.5"/>
  <text x="1150" y="522" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold">Staging Service</text>
  <text x="1150" y="547" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17">(transform + tokenize)</text>

  <!-- yellow note box -->
  <rect x="80" y="460" width="480" height="190" rx="14" fill="#f9c74f" stroke="#000000" stroke-width="2"/>
  <g font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#000000" text-anchor="middle">
    <text x="320" y="503">Re-identification happens only</text>
    <text x="320" y="529">at the write-back step, gated to</text>
    <text x="320" y="555">a single service account --</text>
    <text x="320" y="581">never persisted to GCS,</text>
    <text x="320" y="607">BigQuery, or logs.</text>
  </g>

  <!-- teal KMS box (dashed) -->
  <rect x="1440" y="140" width="200" height="100" rx="10" fill="#dff5f3" stroke="#0f8b8b" stroke-width="2.5" stroke-dasharray="8,6"/>
  <text x="1540" y="180" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#0f5f5f">Cloud KMS</text>
  <text x="1540" y="205" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#0f5f5f">(wrapped key)</text>

  <!-- teal DLP box (solid) -->
  <rect x="1690" y="140" width="220" height="100" rx="10" fill="#dff5f3" stroke="#0f8b8b" stroke-width="2.5"/>
  <text x="1800" y="173" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#0f5f5f">Cloud DLP</text>
  <text x="1800" y="197" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#0f5f5f">(deterministic</text>
  <text x="1800" y="217" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#0f5f5f">encryption)</text>

  <!-- arrow: KMS -> DLP -->
  <line x1="1640" y1="190" x2="1686" y2="190" stroke="#0f8b8b" stroke-width="2.5" marker-end="url(#arrowTeal)"/>
  <text x="1663" y="170" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0f5f5f">wraps/unwraps</text>

  <!-- caption -->
  <text x="1675" y="265" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-style="italic" fill="#555555">managed by Security Admins</text>

  <!-- arrow: teal group -> Staging Service -->
  <line x1="1500" y1="242" x2="1332" y2="458" stroke="#0f8b8b" stroke-width="2.5" stroke-dasharray="10,6" marker-end="url(#arrowTeal)"/>
  <text x="1470" y="330" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#0f5f5f">encrypt (extraction) /</text>
  <text x="1470" y="349" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#0f5f5f">re-identify (write-back)</text>

  <!-- Token Vault API cylinder -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#000000">
    <ellipse cx="1675" cy="310" rx="130" ry="22" fill="#ffffff" stroke="#000000" stroke-width="2.5"/>
    <rect x="1545" y="310" width="260" height="90" fill="#ffffff" stroke="none"/>
    <line x1="1545" y1="310" x2="1545" y2="400" stroke="#000000" stroke-width="2.5"/>
    <line x1="1805" y1="310" x2="1805" y2="400" stroke="#000000" stroke-width="2.5"/>
    <ellipse cx="1675" cy="400" rx="130" ry="22" fill="#ffffff" stroke="#000000" stroke-width="2.5"/>
    <text x="1675" y="362" text-anchor="middle" font-weight="bold">Token Vault API</text>
  </g>

  <!-- arrow: Token Vault -> BigQuery -->
  <line x1="1675" y1="400" x2="1675" y2="446" stroke="#000000" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="1960" y="415" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold">auto-supplies token,</text>
  <text x="1960" y="432" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold">no human</text>

  <!-- BigQuery cylinder -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#000000">
    <ellipse cx="1675" cy="450" rx="140" ry="22" fill="#ffffff" stroke="#000000" stroke-width="2.5"/>
    <rect x="1535" y="450" width="280" height="90" fill="#ffffff" stroke="none"/>
    <line x1="1535" y1="450" x2="1535" y2="540" stroke="#000000" stroke-width="2.5"/>
    <line x1="1815" y1="450" x2="1815" y2="540" stroke="#000000" stroke-width="2.5"/>
    <ellipse cx="1675" cy="540" rx="140" ry="22" fill="#ffffff" stroke="#000000" stroke-width="2.5"/>
    <text x="1675" y="490" text-anchor="middle" font-weight="bold">BigQuery</text>
    <text x="1675" y="512" text-anchor="middle">(reconciled, tokenized)</text>
  </g>

  <!-- arrow: Staging Service -> BigQuery -->
  <line x1="1292" y1="525" x2="1531" y2="495" stroke="#000000" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="1410" y="500" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold">load, tokenized</text>

  <!-- arrow: BigQuery -> Sink Adapter -->
  <line x1="1675" y1="540" x2="1675" y2="586" stroke="#000000" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="1960" y="568" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold">Pub/Sub</text>

  <!-- Sink Adapter -->
  <rect x="1545" y="590" width="260" height="110" rx="14" fill="#ffffff" stroke="#000000" stroke-width="2.5"/>
  <text x="1675" y="632" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="bold">Sink Adapter</text>
  <text x="1675" y="655" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16">(re-identify,</text>
  <text x="1675" y="676" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16">DLP + KMS)</text>

  <!-- arrow: Sink Adapter -> Merchant Target -->
  <line x1="1675" y1="700" x2="1675" y2="746" stroke="#000000" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="1960" y="728" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold">{POST}</text>

  <!-- Merchant Target System cylinder -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#000000">
    <ellipse cx="1675" cy="750" rx="130" ry="22" fill="#ffffff" stroke="#000000" stroke-width="2.5"/>
    <rect x="1545" y="750" width="260" height="90" fill="#ffffff" stroke="none"/>
    <line x1="1545" y1="750" x2="1545" y2="840" stroke="#000000" stroke-width="2.5"/>
    <line x1="1805" y1="750" x2="1805" y2="840" stroke="#000000" stroke-width="2.5"/>
    <ellipse cx="1675" cy="840" rx="130" ry="22" fill="#ffffff" stroke="#000000" stroke-width="2.5"/>
    <text x="1675" y="791" text-anchor="middle" font-weight="bold">Merchant</text>
    <text x="1675" y="813" text-anchor="middle" font-weight="bold">Target System</text>
  </g>

  <!-- comparison table -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="17">
    <rect x="80" y="920" width="1820" height="170" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <rect x="80" y="920" width="1820" height="40" fill="#e8e8e8" stroke="#000000" stroke-width="2"/>
    <line x1="540" y1="920" x2="540" y2="1090" stroke="#000000" stroke-width="1.5"/>
    <line x1="1220" y1="920" x2="1220" y2="1090" stroke="#000000" stroke-width="1.5"/>
    <line x1="80" y1="960" x2="1900" y2="960" stroke="#000000" stroke-width="1.5"/>
    <line x1="80" y1="992" x2="1900" y2="992" stroke="#000000" stroke-width="1"/>
    <line x1="80" y1="1024" x2="1900" y2="1024" stroke="#000000" stroke-width="1"/>
    <line x1="80" y1="1056" x2="1900" y2="1056" stroke="#000000" stroke-width="1"/>

    <text x="105" y="946" font-weight="bold">Component</text>
    <text x="565" y="946" font-weight="bold">v1.1.0</text>
    <text x="1245" y="946" font-weight="bold">v1.1.1</text>

    <text x="105" y="981">PAN at extraction</text>
    <text x="565" y="981">blanked</text>
    <text x="1245" y="981">DLP-tokenized (KMS-wrapped key)</text>

    <text x="105" y="1013">Reconciliation source</text>
    <text x="565" y="1013">human, Firestore Console</text>
    <text x="1245" y="1013">token vault API, automated</text>

    <text x="105" y="1045">Store</text>
    <text x="565" y="1045">Firestore</text>
    <text x="1245" y="1045">BigQuery</text>

    <text x="105" y="1077">Re-identification</text>
    <text x="565" y="1077">n/a -- PAN never stored</text>
    <text x="1245" y="1077">write-back step only, gated</text>
  </g>
</svg>
